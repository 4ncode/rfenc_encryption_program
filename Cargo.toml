[package]
name = "rfenc"
version = "0.1.0"
edition = "2026"
description = "Fast, authenticated file encryption for GNU/Linux (XChaCha20-Poly1305 + Argon2id)"
license = "MIT"
readme = "README.md"
keywords = ["encryption", "cli", "chacha20", "argon2", "security"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
rpassword = "7"
zeroize = "1"
eframe = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

[features]
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "rfenc-gui"
path = "src/gui.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"